<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirma tu cuenta — Mogao</title>
</head>
<body style="margin:0;padding:0;background-color:#F5F1E8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F1E8;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">

          <!-- Logo / Header -->
          <tr>
            <td align="center" style="background-color:#0E3B36;border-radius:16px 16px 0 0;padding:36px 40px 28px;">
              <img
                src="https://www.mogaoinmobiliaria.com/assets/images/logo/mogao-logo.png"
                alt="Mogao"
                width="140"
                style="display:block;height:auto;"
              />
              <div style="width:40px;height:1px;background-color:rgba(201,162,39,0.6);margin:20px auto 0;"></div>
            </td>
          </tr>

          <!-- Cuerpo -->
          <tr>
            <td style="background-color:#FFFFFF;padding:40px 40px 32px;border-left:1px solid #EDE9DC;border-right:1px solid #EDE9DC;">

              <p style="margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#8A6C1B;">
                Verificación de cuenta
              </p>
              <h1 style="margin:0 0 12px;font-size:26px;font-weight:700;color:#0E3B36;line-height:1.2;">
                Confirma tu correo
              </h1>
              <p style="margin:0 0 28px;font-size:14px;color:#6B7280;line-height:1.6;">
                Usa el siguiente código de 6 dígitos para verificar tu cuenta en Mogao. Expira en <strong>10 minutos</strong>.
              </p>

              <!-- Código OTP -->
              <div style="background-color:#FAF7F0;border:1px solid rgba(201,162,39,0.3);border-radius:12px;padding:28px;text-align:center;margin-bottom:28px;">
                <p style="margin:0 0 8px;font-size:12px;color:#9CA3AF;letter-spacing:1px;text-transform:uppercase;">Tu código de verificación</p>
                <p style="margin:0;font-size:44px;font-weight:700;letter-spacing:12px;color:#0E3B36;">{{ .Token }}</p>
              </div>

              <p style="margin:0 0 8px;font-size:13px;color:#9CA3AF;text-align:center;">
                Si no creaste una cuenta en Mogao, puedes ignorar este correo.
              </p>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#0E3B36;border-radius:0 0 16px 16px;padding:20px 40px;text-align:center;">
              <p style="margin:0;font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:1px;text-transform:uppercase;">
                Mogao · Servicios inmobiliarios y asesoría legal
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
